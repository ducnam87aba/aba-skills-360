# ABA Skills 360 - Docker Environment
# Runs WordPress, MySQL 8.0, and phpMyAdmin

services:
  db:
    image: mysql:8.0
    container_name: aba-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aba_skills}
      MYSQL_USER: ${MYSQL_USER:-aba_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aba_secret_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - aba-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: aba-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-aba_skills}
      WORDPRESS_DB_USER: ${MYSQL_USER:-aba_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-aba_secret_password}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./apps/wordpress/wp-content/plugins/aba-skills-core:/var/www/html/wp-content/plugins/aba-skills-core
    ports:
      - "${WP_PORT:-8080}:80"
    networks:
      - aba-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aba-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - aba-network

volumes:
  db_data:
  wp_data:

networks:
  aba-network:
    driver: bridge
